[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-feast-mlops-platform"
version = "0.1.0"
description = "Real-Time Feature Store & MLOps Platform with Point-in-Time Correct Historical Joins, Low-Latency Online Serving, and Drift Monitoring"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pranav Yeleswarapu", email = "yeleswarapupranav@gmail.com" }]
dependencies = [
    "duckdb>=0.9.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pydantic>=2.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.80.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "scipy.*", "pyarrow.*"]
ignore_missing_imports = true
